name: CD - Deployment

on:
  workflow_run:
    workflows: ["CI - Tests & Quality"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Railway
      uses: railwayapp/action@v1
      if: github.ref == 'refs/heads/main'
      with:
        railway_token: ${{ secrets.RAILWAY_TOKEN }}
        service: video-ai-studio
        environment: production
    
    - name: Deploy to Fly.io
      uses: superfly/flyctl-actions@1.4
      if: github.ref == 'refs/heads/main'
      with:
        args: "deploy --remote-only --config fly.toml"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    
    - name: Send deployment notification
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: deployments
        SLACK_COLOR: ${{ job.status }}
        SLACK_TITLE: "Video AI Studio Deployment"
        SLACK_MESSAGE: "Deployment to production completed successfully"