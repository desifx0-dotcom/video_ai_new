version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - video_ai_network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: production
    environment:
      - FLASK_APP=app:app
      - FLASK_ENV=production
      - DATABASE_PROVIDER=firebase
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - STABILITY_API_KEY=${STABILITY_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    volumes:
      - uploads_volume:/tmp/video_ai/uploads
      - processing_volume:/tmp/video_ai/processing
      - outputs_volume:/tmp/video_ai/outputs
      - logs_volume:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command: >
      gunicorn --bind 0.0.0.0:5000 \
               --workers 4 \
               --worker-class eventlet \
               --timeout 120 \
               --keep-alive 5 \
               --access-logfile - \
               --error-logfile - \
               --log-level info \
               app:app
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - video_ai_network

  worker:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
      target: production
    environment:
      - DATABASE_PROVIDER=firebase
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - STABILITY_API_KEY=${STABILITY_API_KEY}
    volumes:
      - uploads_volume:/tmp/video_ai/uploads
      - processing_volume:/tmp/video_ai/processing
      - outputs_volume:/tmp/video_ai/outputs
    depends_on:
      - redis
    command: >
      celery -A tasks.celery_app:celery worker \
             --loglevel=info \
             --concurrency=4 \
             --max-tasks-per-child=100 \
             --queues=default,priority,vip \
             -n worker.%%h
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - video_ai_network

  worker_priority:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
      target: production
    environment:
      - DATABASE_PROVIDER=firebase
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - STABILITY_API_KEY=${STABILITY_API_KEY}
    volumes:
      - uploads_volume:/tmp/video_ai/uploads
      - processing_volume:/tmp/video_ai/processing
      - outputs_volume:/tmp/video_ai/outputs
    depends_on:
      - redis
    command: >
      celery -A tasks.celery_app:celery worker \
             --loglevel=info \
             --concurrency=2 \
             --max-tasks-per-child=50 \
             --queues=priority,vip \
             -n priority_worker.%%h
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - video_ai_network

  beat:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
      target: production
    environment:
      - DATABASE_PROVIDER=firebase
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
    command: celery -A tasks.celery_app:celery beat --loglevel=info
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - video_ai_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./static:/app/static:ro
      - uploads_volume:/app/data/uploads:ro
    depends_on:
      - web
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - video_ai_network

volumes:
  redis_data:
  uploads_volume:
  processing_volume:
  outputs_volume:
  logs_volume:

networks:
  video_ai_network:
    driver: bridge