version: '3.8'

services:
  # Redis for caching and message queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - video_ai_network

  # PostgreSQL database (optional, can use Firebase)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: video_ai_studio
      POSTGRES_USER: video_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video_ai_network

  # Web application
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app:app
      - FLASK_ENV=development
      - DATABASE_PROVIDER=firebase
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
      - uploads_volume:/app/data/uploads
      - processing_volume:/app/data/processing
      - outputs_volume:/app/data/outputs
      - logs_volume:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m pip install --no-cache-dir -r requirements-dev.txt &&
             flask run --host=0.0.0.0 --port=5000 --reload"
    networks:
      - video_ai_network

  # Celery worker for background tasks
  worker:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    environment:
    - DATABASE_PROVIDER=firebase
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    - FLASK_ENV=development
    - GOOGLE_APPLICATION_CREDENTIALS=/app/config/firebase-credentials.json
    volumes:
    - .:/app
    - ./config:/app/config:ro  # Mount config for credentials
    - uploads_volume:/app/data/uploads
    - processing_volume:/app/data/processing
    - outputs_volume:/app/data/outputs
    depends_on:
      - redis
      #- web
    command: celery -A tasks.celery_app:celery worker --loglevel=info --pool=solo --concurrency=2
    networks:
      - video_ai_network

  # Celery beat for scheduled tasks
  beat:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    environment:
      - DATABASE_PROVIDER=firebase
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - worker
    command: celery -A tasks.celery_app:celery beat --loglevel=info
    networks:
      - video_ai_network

  # Monitoring with Prometheus and Grafana (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/console_templates'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - video_ai_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - video_ai_network

  # NGINX reverse proxy (optional for production-like setup)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./static:/app/static:ro
      - uploads_volume:/app/data/uploads:ro
    depends_on:
      - web
    networks:
      - video_ai_network

volumes:
  redis_data:
  postgres_data:
  uploads_volume:
  processing_volume:
  outputs_volume:
  logs_volume:
  prometheus_data:
  grafana_data:

networks:
  video_ai_network:
    driver: bridge