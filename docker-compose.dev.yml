version: '3.8'

services:
  web:
    ports:
      - "5000:5000"
      - "5678:5678"  # For debugger
    environment:
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      sh -c "pip install --no-cache-dir -r requirements-dev.txt &&
             python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m flask run --host=0.0.0.0 --port=5000 --reload"
    stdin_open: true
    tty: true

  worker:
    environment:
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=10
    volumes:
      - .:/app
      - ./data:/app/data
    command: celery -A tasks.celery_app:celery worker --loglevel=debug --concurrency=1

  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_USER=video_ai
      - POSTGRES_DB=video_ai_studio

  redis:
    ports:
      - "6379:6379"

  # Add test database
  postgres_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: video_ai_test
      POSTGRES_USER: video_ai_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - video_ai_network

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - video_ai_network

  # Adminer for database management
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - video_ai_network

volumes:
  postgres_test_data:

networks:
  video_ai_network:
    driver: bridge